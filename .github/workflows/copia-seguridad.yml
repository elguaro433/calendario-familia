name: Copia de seguridad del calendario

on:
  schedule:
    - cron: '17 3 * * *'   # cada día a las 3:17 (UTC)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/copia-seguridad.yml']

permissions:
  contents: write

concurrency:
  group: copia-seguridad
  cancel-in-progress: false

jobs:
  copia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/copia-seguridad.js
      - name: Guardar si ha cambiado
        run: |
          git add backup/eventos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Copia de seguridad del calendario"
          git push
