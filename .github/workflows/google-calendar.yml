name: Actualizar calendario de Google y copia

on:
  schedule:
    - cron: '17 * * * *'   # cada hora
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]
    paths: ['compartido.js', 'scripts/**', '.github/workflows/google-calendar.yml']

permissions:
  contents: write

concurrency:
  group: familia-ics
  cancel-in-progress: false

jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/generar-ics.js
      - name: Publicar si ha cambiado
        run: |
          git add familia.ics backup/eventos.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar calendario y copia de seguridad"
          git push
